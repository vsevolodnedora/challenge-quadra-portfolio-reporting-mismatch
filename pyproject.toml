[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadra-recon"
version = "0.1.0"
description = "QUADRA January-2025 Deckungsbeitrag reconciliation: faithful API extraction + DuckDB store"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
